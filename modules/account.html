<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monamaathu | Learner Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f8f4e9;
      color: #244d36;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      background: white;
      border: 1px solid #e7dcc1;
      border-radius: 20px;
      box-shadow: 0 10px 35px #244d3612;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #667568; }
    .tabs { display: flex; gap: 10px; margin: 24px 0; }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
    }
    .tabs button {
      flex: 1;
      background: #edf2e9;
      color: #244d36;
    }
    .tabs button.active, .submit {
      background: #286342;
      color: white;
    }
    label { display: block; margin: 14px 0 6px; }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5ddcf;
      border-radius: 9px;
      font-size: 16px;
    }
    .submit {
      width: 100%;
      margin-top: 20px;
      font-size: 16px;
    }
    .submit:disabled { opacity: 0.7; cursor: wait; }
    #message {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #286342;
    }
    .note {
      font-size: 13px;
      color: #667568;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🌿 Monamaathu</h1>
    <p class="subtitle">Your Kannada learning journey starts here.</p>

    <div class="tabs">
      <button type="button" id="signupTab" class="active">Sign Up</button>
      <button type="button" id="loginTab">Log In</button>
    </div>

    <form id="accountForm">
      <div id="nameGroup">
        <label for="name">Your name</label>
        <input id="name" type="text" autocomplete="name"
               placeholder="Enter your name" required>
      </div>

      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="new-password"
             placeholder="At least 8 characters" minlength="8" required>

      <button class="submit" id="submitButton" type="submit">
        Create Account
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p class="note">
      Use an email address you can access. Supabase may ask you to confirm your email.
    </p>

    <a class="back" href="../index.html">← Back to Home</a>
  </main>

  <script type="module">
    import { supabase } from '../supabase-config.js';

    const form = document.getElementById('accountForm');
    const nameGroup = document.getElementById('nameGroup');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const submitButton = document.getElementById('submitButton');
    const signupTab = document.getElementById('signupTab');
    const loginTab = document.getElementById('loginTab');

    const HOME_PAGE = '../index.html';
    let mode = 'signup';

    function setMode(nextMode) {
      mode = nextMode;
      const signingUp = mode === 'signup';

      signupTab.classList.toggle('active', signingUp);
      loginTab.classList.toggle('active', !signingUp);
      nameGroup.hidden = !signingUp;
      nameInput.required = signingUp;

      passwordInput.autocomplete = signingUp
        ? 'new-password'
        : 'current-password';

      submitButton.textContent = signingUp ? 'Create Account' : 'Log In';
      message.textContent = '';
    }

    signupTab.addEventListener('click', () => setMode('signup'));
    loginTab.addEventListener('click', () => setMode('login'));

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      submitButton.disabled = true;
      submitButton.textContent = 'Please wait...';

      try {
        if (mode === 'signup') {
          const { data, error } = await supabase.auth.signUp({
            email: emailInput.value.trim(),
            password: passwordInput.value,
            options: {
              data: { display_name: nameInput.value.trim() },
              emailRedirectTo:
                window.location.origin + '/modules/account.html'
            }
          });

          if (error) throw error;

          if (data.session) {
            window.location.replace(HOME_PAGE);
            return;
          }

          message.textContent =
            'Account created. Check your email, confirm your account, then log in.';
        } else {
          const { error } = await supabase.auth.signInWithPassword({
            email: emailInput.value.trim(),
            password: passwordInput.value
          });

          if (error) throw error;

          window.location.replace(HOME_PAGE);
          return;
        }
      } catch (error) {
        message.textContent =
          error.message || 'Something went wrong. Please try again.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent =
          mode === 'signup' ? 'Create Account' : 'Log In';
      }
    });
  </script>
</body>
</html>
